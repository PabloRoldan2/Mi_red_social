    <link rel="stylesheet" href="perfil.css">

</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header class="navbar">
        <h2>Red Social</h2>
        <div class="nav-right">
            <a href="index.html" class="btn-inicio">Inicio</a>
            <a href="#" id="logout_btn" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <main class="feed">

            <div id="formPerfil" class="card post">
                <h1>Perfil de Usuario</h1>
                <p><strong>Avatar:</strong></p>
                <!-- Mostrar el avatar del usuario si existe, de lo contrario mostrar un avatar por defecto -->
                <img id="user-avatar" class="avatar" src="" alt="Avatar del usuario"/>

                <p><strong>Nombre:</strong> <span id="user-name"></span></p>
                <p><strong>Nick:</strong> <span id="user-nick"></span></p>
                <p><strong>Correo:</strong> <span id="user-email"></span></p>
                <button id="Actualizar" class="btn-actualizar"
                    onclick="window.location.href='actualizar_usuario.html'">Actualizar Perfil</button>
                <button id="Cambiar_contrasenia" class="btn-actualizar_contrasenia"
                    onclick="window.location.href='cambiar_contrasenia.html'">Cambiar Contraseña</button>
                <button id="subir_avatar" class="btn-subir_avatar"
                    onclick="window.location.href='subir_avatar.html'">Subir Avatar</button>
            </div>

        </main>

    </div>

    <script src="perfil.js"></script>

    <script>
        // Función para cerrar sesión y redirigir al login
        document.getElementById('logout_btn').addEventListener('click', function () {
            localStorage.removeItem('token'); // Elimina el token de autenticación
            localStorage.removeItem('user'); // Elimina el usuario del almacenamiento local
            window.location.href = 'login.html'; // Redirige al login
        });
    </script>

</body>

</html>
