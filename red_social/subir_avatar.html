<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Avatar</title>
    <link rel="stylesheet" href="subir_avatar.css">

    <!--Script para verificar el token de autenticación y redirigir al login si no está presente -->
    <script>
        // 1. Validar al cargar la página normalmente
        document.addEventListener('DOMContentLoaded', () => {
            verificarToken();
        });

        // 2. Validar cuando el usuario presiona el botón "Atrás" (carga desde la caché)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                verificarToken();
            }
        });

        function verificarToken() {
            const token = localStorage.getItem('token');
            if (!token) {
                // Si no hay token, lo saca de inmediato al login y borra el historial
                window.location.replace('login.html');
            }
        }
    </script>
    
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header class="navbar">
        <h2>Red Social</h2>
        <div class="nav-right">
            <a href="index.html" class="btn-inicio">Inicio</a>
            <a href="#" id="logout_btn" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <main class="feed">

            <form id="formAvatar">
                <div class="card post">
                    <h1>Subir Avatar</h1>
                    <p>Selecciona una imagen (jpg, png, jpeg o gif).</p>
                    <input type="file" id="avatarInput" class="avatarInput" name="file0"/>
                    <button type="submit" id="subir_avatar" class="btn-subir_avatar">Subir Avatar</button>
                    <button id="Cancelar" class="btn-cancelar" onclick="window.location.href='perfil.html'">Cancelar</button>
                </div>
            </form>
        </main>

    </div>

    <script src="subir_avatar.js"></script>

    <script>
        // Función para cerrar sesión y redirigir al login
        document.getElementById('logout_btn').addEventListener('click', function () {
            localStorage.removeItem('token'); // Elimina el token de autenticación
            localStorage.removeItem('user'); // Elimina el usuario del almacenamiento local
            window.location.href = 'login.html'; // Redirige al login
        });
    </script>

</body>

</html>
