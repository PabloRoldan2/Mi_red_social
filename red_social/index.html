<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi_Red_Social</title>
    <link rel="stylesheet" href="index.css">

    <!--Script para verificar el token de autenticación y redirigir al login si no está presente -->
    <script>
        // 1. Validar al cargar la página normalmente
        document.addEventListener('DOMContentLoaded', () => {
            verificarToken();
        });

        // 2. Validar cuando el usuario presiona el botón "Atrás" (carga desde la caché)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                verificarToken();
            }
        });

        function verificarToken() {
            const token = localStorage.getItem('token');
            if (!token) {
                // Si no hay token, lo saca de inmediato al login y borra el historial
                window.location.replace('login.html');
            }
        }
    </script>

</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header class="navbar">
        <h2>Mi Red Social</h2>
        <div class="nav-right">
            <!-- Botón de Cerrar Sesión que redirige al login -->
            <a href="perfil.html" id="perfil" class="btn-perfil">Perfil</a>
            <a href="#" id="logout_btn" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <main class="feed">
            <!-- Crear post -->
            <div class="card">
                <form id="form_publicar">
                    <textarea id="texto_publicacion" name="text" placeholder="¿Qué estás pensando hoy?"></textarea>
                    <!-- Input opcional para la imagen de la publicación -->
                    <input type="file" id="fileInput" class="imagen_input" name="file0" accept="image/*" />
                    <button type="submit" id="btn-publicar" class="btn-primary">Publicar</button>
                </form>
            </div>

            <!-- Publicación 1 -->
            <div id="feed_contenedor">


            </div>
        </main>

    </div>
    <script src="mostrar_publicaciones.js"></script>

    <script src="index.js"></script>

    <script>
        // Función para cerrar sesión y redirigir al login
        document.getElementById('logout_btn').addEventListener('click', function () {
            localStorage.removeItem('token'); // Elimina el token de autenticación
            localStorage.removeItem('user'); // Elimina el usuario del almacenamiento local
            window.location.href = 'login.html'; // Redirige al login
        });
    </script>

</body>

</html>
